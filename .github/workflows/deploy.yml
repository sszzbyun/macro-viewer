name: Auto Sync from Google Drive

on:
  schedule:
    - cron: '0 21 * * *'   # 오전 6시 KST
    - cron: '0 4 * * *'    # 오후 1시 KST
    - cron: '0 12 * * *'   # 오후 9시 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install gdown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync from Google Drive
        run: |
          python3 sync_ci.py

      - name: Build report index
        run: node scripts/build-index.js

      - name: Check for changes
        id: check_changes
        run: |
          git add public/reports/ public/reports.json .sync_cache.json || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "변경된 파일 없음 - 배포 스킵"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "변경된 파일 감지 - 배포 진행"
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto Sync: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST') 구글 드라이브 리포트 자동 업데이트"
          git push origin main
